# E3: WavLM fine-tuned together with the head, starting from the E2 checkpoint.
# Sized for a 6 GB GPU.
name: e3_finetune
seed: 42
out_dir: runs/e3_finetune

data:
  dir: data/ami
  fraction: 1.0           # part of the train meetings to use
  chunk_sec: 10.0
  augment: true           # random volume and noise on training chunks
  num_workers: 4

model:
  type: wavlm
  name: microsoft/wavlm-base-plus
  freeze: false           # the CNN feature encoder still stays frozen
  head: bilstm
  hidden: 256
  layers: 2
  dropout: 0.1

train:
  init_from: runs/e2_frozen/best.pt
  batch_size: 4
  epochs: 6
  steps_per_epoch: 8000   # 4 x 8000 chunks = about one pass over AMI train
  lr: 0.0001              # head and layer weights
  wavlm_lr: 0.00001       # WavLM transformer
  weight_decay: 0.01
  warmup: 0.1
  grad_clip: 5.0
  amp: true
  val_max_chunks: 1500
