# E1 trained twice as long (40 epochs) to check whether 20 epochs were enough.
name: e1_scratch_long
seed: 42
out_dir: runs/e1_scratch_long

data:
  dir: data/ami
  fraction: 1.0           # part of the train meetings to use
  chunk_sec: 10.0
  augment: true           # random volume and noise on training chunks
  num_workers: 4

model:
  type: logmel
  channels: 256
  head: bilstm            # bilstm | linear
  hidden: 256
  layers: 2
  dropout: 0.1

train:
  batch_size: 32
  epochs: 40
  steps_per_epoch: 1000   # 32 x 1000 chunks = about one pass over AMI train
  lr: 0.001
  weight_decay: 0.01
  warmup: 0.1             # part of all steps
  grad_clip: 5.0
  amp: true
  val_max_chunks: 1500
